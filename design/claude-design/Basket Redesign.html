<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Basket — Redesign Options</title>
<link rel="stylesheet" href="basket.css" />
<style>
  html, body { margin: 0; height: 100%; background: #f0eee9; }
  #root { height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="basket-options.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;

  function App() {
    return (
      <DesignCanvas>
        <DCSection
          id="timeline"
          title="Basket — Main Timeline"
          subtitle="Soft matcha · friendly + premium · bolder Gantt. Four moods to compare.">
          <DCArtboard id="a" label="A · Fresh Matcha" width={380} height={800}>
            <OptionA />
          </DCArtboard>
          <DCArtboard id="b" label="B · Layered Cards" width={380} height={800}>
            <OptionB />
          </DCArtboard>
          <DCArtboard id="c" label="C · Smart Gantt (the bar is the budget)" width={380} height={800}>
            <OptionC />
          </DCArtboard>
          <DCArtboard id="d" label="D · Forest (deep hero + lime pop)" width={380} height={800}>
            <OptionD />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
